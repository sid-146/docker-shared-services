services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-main
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - shared-infra-net

  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    container_name: litellm-main
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${LITELLM_POSTGRES_USER}:${LITELLM_POSTGRES_PASSWORD}@postgres:5432/${LITELLM_POSTGRES_DB}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}


    # # ----  LangSmith Integration ----
    # - LANGSMITH_API_KEY=${LANGSMITH_API_KEY} # Standard key name
    # - LANGSMITH_PROJECT=${LANGSMITH_PROJECT} # Standard project name
    # - LANGSMITH_TRACING=true                  # Required for tracing
    # - LANGSMITH_BATCH_SIZE=1                 # Set to 1 to see traces instantly in dev
    volumes:
      - ./configs/litellm-config.yaml:/app/litellm-config.yaml
    ports:
      - "4000:4000" # Proxy accessible at http://localhost:4000
    command: ["--config", "/app/litellm-config.yaml"]
    depends_on:
      - postgres
      - ollama
    networks:
      - shared-infra-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-main
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # or 1, if you have multiple GPUs
              capabilities: [gpu]
    networks:
      - shared-infra-net
  
  milvus-etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shared-infra-net

  milvus-standalone:
    container_name: milvus-main
    image: milvusdb/milvus:v2.6.15
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "milvus-etcd"
      - "minio"
      - "minio-create-bucket"
    networks:
      - shared-infra-net

  minio:
    container_name: minio-main
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shared-infra-net


  minio-create-bucket:
    image: minio/mc
    container_name: minio-create-bucket-main
    depends_on:
      minio:
        condition: service_healthy
    volumes:
    - ./scripts/milvus/create-buckets.sh:/scripts/create-buckets.sh
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    env_file: .env
    restart: "no"
    networks:
      - shared-infra-net
      

  attu:
    container_name: attu-main
    image: zilliz/attu:v3.0.0-beta.1
    ports:
      - "3000:3000"
    environment:
      - MILVUS_ADDRESS=milvus-standalone:19530
    volumes:
      - attu_data:/data
    depends_on:
      - milvus-standalone
    networks:
      - shared-infra-net


volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: F:\docker-images\volumes\pg_data
  
  ollama_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: F:/docker-images/volumes/ollama_data

  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: F:\docker-images\volumes\minio_data

  milvus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: F:/docker-images/volumes/milvus_data
  
  milvus_etcd_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: F:/docker-images/volumes/milvus_etcd_data

  attu_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: F:/docker-images/volumes/attu_data


networks:
  shared-infra-net:
    name: shared-infra-net  # Forces the exact network name
    driver: bridge