name: local-shared-cloud

# Plug-and-play service inclusions from catalog or custom services
# Use `.\manage.ps1 add-service <name>` to enable new services automatically
include:
  - catalog/redis/compose.yaml
  - catalog/curio/compose.yaml

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-main
    restart: unless-stopped
    profiles: ["postgres", "core", "all"]
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      shared-infra-net:
        aliases:
          - postgres
          - postgres-main

  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    container_name: litellm-main
    restart: unless-stopped
    profiles: ["litellm", "ai", "all"]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${LITELLM_POSTGRES_USER}:${LITELLM_POSTGRES_PASSWORD}@postgres:5432/${LITELLM_POSTGRES_DB}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
    volumes:
      - ./configs/litellm-config.yaml:/app/litellm-config.yaml
    ports:
      - "4000:4000"
    command: ["--config", "/app/litellm-config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - shared-infra-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-main
    restart: unless-stopped
    profiles: ["ollama", "ai", "all"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - shared-infra-net

  minio:
    container_name: minio-main
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    profiles: ["minio", "core", "all"]
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shared-infra-net

  minio-create-bucket:
    image: minio/mc
    container_name: minio-create-bucket-main
    profiles: ["minio", "core", "all"]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./scripts/minio/create-buckets.sh:/scripts/create-buckets.sh
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    env_file: .env
    restart: "no"
    networks:
      - shared-infra-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-main
    restart: unless-stopped
    profiles: ["qdrant", "vector", "all"]
    ports:
      - "6333:6333" # REST API & Web Dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      shared-infra-net:
        aliases:
          - qdrant
          - qdrant-main

  langfuse:
    image: ghcr.io/langfuse/langfuse:3
    container_name: langfuse-main
    restart: unless-stopped
    profiles: ["langfuse", "observability", "all"]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${LANGFUSE_POSTGRES_USER}:${LANGFUSE_POSTGRES_PASSWORD}@postgres:5432/${LANGFUSE_POSTGRES_DB}
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - TELEMETRY_ENABLED=false
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-infra-net

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUMES_ROOT:-D:/docker-images/volumes}/pg_data

  ollama_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUMES_ROOT:-D:/docker-images/volumes}/ollama_data

  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUMES_ROOT:-D:/docker-images/volumes}/minio_data

  qdrant_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUMES_ROOT:-D:/docker-images/volumes}/qdrant_data

networks:
  shared-infra-net:
    name: shared-infra-net
    driver: bridge
